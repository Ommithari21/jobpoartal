spring.application.name=${app_name}

#spring.datasource.url=jdbc:mysql://localhost:3306/om
spring.datasource.url=${Database_Url}
spring.datasource.username=${Database_UserName}
spring.datasource.password=${Database_PassWord}
spring.datasource.driver-class-name=${Database_Driver}

spring.jpa.hibernate.ddl-auto=${Hibernate_ddl}
spring.jpa.show-sql=${Jpa}
spring.jpa.properties.hibernate.dialect=${Hibernate_dialect}





jwt.secret=${Jwt_Secrete}

cloud.aws.credentials.access-key=${Aws_Access_Key}
cloud.aws.credentials.secret-key=${Aws_Secrete_Key}
cloud.aws.region.static=${Aws_Region}
aws.s3.bucket-name=${Bucket_Name}



spring.redis.host:${Redis_Host}
spring.redis.port:${Redis_Port}








